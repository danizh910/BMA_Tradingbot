[project]
name = "bma-btc-tradingbot"
version = "0.1.0"
description = "BMA: regelbasierter Bitcoin-Trading-Bot im Backtesting (BTC/USDT, Tagesdaten 2018–2025)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "pyyaml>=6.0",
    "streamlit>=1.35",
    "plotly>=5.20",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bot --cov-report=term-missing"
